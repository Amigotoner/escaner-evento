<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mi acceso</title>
<style>
  :root{ --tinta:#0f172a; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--fuente, -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif);
    background:#f8fafc;color:var(--tinta);min-height:100vh;padding:20px 16px;
    display:flex;align-items:center;justify-content:center
  }
  .card{
    background:#fff;border-radius:18px;padding:26px 22px;max-width:400px;width:100%;
    box-shadow:0 4px 24px rgba(15,23,42,.08);text-align:center
  }
  .evento{font-size:13px;color:#64748b;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
  h1{font-size:23px;margin:8px 0 3px;letter-spacing:-.02em}
  .meta{font-size:13.5px;color:#64748b;margin-bottom:20px}
  .qr{
    background:#fff;padding:14px;border:1px solid #e2e8f0;border-radius:14px;
    display:inline-block;margin-bottom:16px
  }
  .qr img{display:block;width:250px;height:250px}
  .nombre{font-size:21px;font-weight:750;letter-spacing:-.01em}
  .paseid{font-size:12.5px;color:#94a3b8;font-family:ui-monospace,Menlo,monospace;margin-top:3px}
  .datos{margin-top:18px;border-top:1px solid #f1f5f9;padding-top:14px}
  .dato{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
  .dato span:last-child{font-weight:650}
  .aviso{padding:12px 14px;border-radius:9px;font-size:13px;margin-top:16px;line-height:1.5;text-align:left}
  .warn{background:#fffbeb;color:#92400e;border-left:3px solid #d97706}
  .ok{background:#f0fdf4;color:#166534;border-left:3px solid #16a34a}
  .err{background:#fef2f2;color:#991b1b;border-left:3px solid #dc2626}
  .nota{font-size:12px;color:#94a3b8;margin-top:18px;line-height:1.5}
  .btnDescargar{
    display:inline-block;background:var(--tinta);color:#fff;border:0;border-radius:9px;
    padding:11px 20px;font-size:13.5px;font-weight:650;cursor:pointer;font-family:inherit;
    margin-bottom:14px
  }
  .cajaSubasta{
    background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-top:16px;text-align:left
  }
  .cajaSubasta p{font-size:13px;color:#334155;margin-bottom:10px;line-height:1.5}
  .btnSubasta{
    display:block;background:var(--tinta);color:#fff;border:0;border-radius:9px;
    padding:12px 20px;font-size:14px;font-weight:650;cursor:pointer;font-family:inherit;
    text-decoration:none;text-align:center
  }
  .cargando{color:#64748b;font-size:14px}
  .oculto{display:none}
  .avisoConfig{
    background:#7c2d12;color:#fed7aa;padding:13px 15px;border-radius:9px;font-size:13px;
    margin-bottom:14px;line-height:1.5;text-align:left
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div id="avisoConfig" class="avisoConfig oculto">
    ⚠️ Falta configurar la URL del sistema en este archivo (constante <b>API_URL</b>, al inicio del
    &lt;script&gt;).
  </div>
  <div class="cargando" id="cargando">Cargando tu acceso…</div>
</div>

<script>
/* Pega aquí la URL de tu aplicación web de Apps Script, terminada en /exec. */
var API_URL = 'https://script.google.com/macros/s/AKfycbx47wiWLThmArQIirAXMtA6xAytZphK8q0sQ0fnOQmCqUz5WCBwe700pizTMOp-vD2K/exec';

if (!API_URL || API_URL.indexOf('PEGA_AQUI') >= 0) {
  document.getElementById('avisoConfig').classList.remove('oculto');
}

function llamarApi(accion, datos){
  var payload = Object.assign({p: 'apiReserva', accion: accion}, datos || {});
  var qs = Object.keys(payload).map(function(k){
    var v = payload[k];
    if (v === undefined || v === null) v = '';
    if (typeof v === 'object') v = JSON.stringify(v);
    return encodeURIComponent(k) + '=' + encodeURIComponent(v);
  }).join('&');
  return fetch(API_URL + '?' + qs).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

var token = new URLSearchParams(window.location.search).get('t') || '';
var c = document.getElementById('card');

llamarApi('datosPase', {token: token}).then(mostrarPase).catch(function(){
  c.innerHTML = '<div class="aviso err" style="text-align:center">No pudimos cargar tu acceso. Revisa tu conexión e intenta de nuevo.</div>';
});

function mostrarPase(D){
  if(!D || !D.ok){
    c.innerHTML = '<div class="aviso err" style="text-align:center">'+
      ((D && D.mensaje) || 'Este código no es válido.')+'</div>';
    return;
  }

  // Identidad visual del cliente (Config > COLOR_PRINCIPAL / URL_LOGO / FUENTE_GOOGLE)
  document.documentElement.style.setProperty('--tinta', D.colorPrincipal);
  var logoHtml = D.urlLogo
    ? '<img src="'+D.urlLogo+'" alt="Logo" style="max-height:48px;max-width:100%;margin-bottom:12px">'
    : '';
  if(D.fuenteGoogle){
    var linkFuente = document.createElement('link');
    linkFuente.rel = 'stylesheet';
    linkFuente.href = 'https://fonts.googleapis.com/css2?family=' +
      encodeURIComponent(D.fuenteGoogle).replace(/%20/g,'+') + ':wght@400;600;700&display=swap';
    document.head.appendChild(linkFuente);
    document.documentElement.style.setProperty('--fuente', "'" + D.fuenteGoogle + "', sans-serif");
  }

  // El QR ya viene generado desde el servidor (obtenerDatosPasePublico), como
  // imagen embebida. Si por algo faltara, usamos la URL externa como respaldo.
  var qrUrl = D.qrDataUri || ('https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=0&data=' +
    encodeURIComponent(D.token));

  var estadoPago = '';
  if(D.estatusPago === 'PAGADO'){
    estadoPago = '<div class="aviso ok"><b>✅ Pago confirmado.</b><br>' +
      'Presenta este código en la entrada y recibirás tu pulsera.</div>';
  } else if(D.metodoPago === 'EFECTIVO'){
    estadoPago = '<div class="aviso warn"><b>💵 Pago pendiente: ' + D.saldoTexto + '</b><br>' +
      'Realiza tu pago en efectivo con el personal de caja al ingresar. ' +
      'Tu acceso es a lugares generales, sin mesa asignada.</div>';
  } else {
    estadoPago = '<div class="aviso warn"><b>⏳ Pago pendiente: ' + D.saldoTexto + '</b><br>' +
      'Aún no hemos verificado tu transferencia. En cuanto la confirmemos, este estatus ' +
      'cambiará solo a Pagado — vuelve a abrir este link para revisarlo.</div>';
  }

  c.innerHTML =
    logoHtml +
    '<div class="evento">' + D.evento + '</div>' +
    '<h1>Acceso personal</h1>' +
    '<div class="meta">' + D.fecha + ' · ' + D.hora + ' h<br>' + D.lugarEvento + '</div>' +
    '<div class="qr"><img id="imgQR" src="' + qrUrl + '" alt="Código QR de acceso"></div>' +
    '<button class="btnDescargar" id="btnDescargarQR">Descargar código QR</button>' +
    '<div class="nombre">' + D.nombre + '</div>' +
    '<div class="paseid">' + D.paseID + '</div>' +
    '<div class="datos">' +
      '<div class="dato"><span>Ubicación</span><span>' + D.ubicacion + '</span></div>' +
      '<div class="dato"><span>Estatus de pago</span><span>' + D.estatusPago + '</span></div>' +
    '</div>' +
    estadoPago +
    (D.subastaActiva
      ? '<div class="cajaSubasta"><p>🔨 <b>Hay una subasta en vivo en este evento.</b> ' +
        'Entra desde aquí para ver los artículos y pujar — ya quedas identificado con tu propio acceso, ' +
        'sin necesidad de escribir tus datos otra vez.</p>' +
        '<a class="btnSubasta" href="' + D.urlSubasta + '">Ir a pujar en la subasta</a></div>'
      : '') +
    '<div class="nota">Este código es único y personal. Solo permite un ingreso por persona, ' +
    'al entrar recibirás una pulsera que te dejará salir y volver libremente durante el evento.<br><br>' +
    'Sube el brillo de tu pantalla al momento de escanear.</div>';

  document.getElementById('btnDescargarQR').addEventListener('click', function(){
    var boton = this;
    boton.disabled = true;
    boton.textContent = 'Generando imagen...';

    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){
      try {
        dibujarYDescargar(img, D, boton);
      } catch (e) {
        boton.disabled = false;
        boton.textContent = 'Descargar código QR';
        alert('No se pudo generar la imagen. Mantén presionado el QR de arriba para guardarlo.');
      }
    };
    img.onerror = function(){
      boton.disabled = false;
      boton.textContent = 'Descargar código QR';
      alert('No se pudo generar la imagen. Mantén presionado el QR de arriba para guardarlo.');
    };
    img.src = qrUrl;
  });

  /**
   * Dibuja la tarjeta a mano en un <canvas> (texto + imagen del QR ya
   * cargada) en vez de "fotografiar" el DOM con una librería — esto es lo
   * que finalmente funciona: html2canvas fallaba en capturar el QR tanto
   * dentro de Apps Script como fuera, en GitHub Pages, así que el problema
   * era de la librería, no del entorno. Dibujar directamente con la API
   * de canvas es una ruta de código distinta y mucho más confiable.
   */
  function dibujarYDescargar(imgQR, D, boton){
    var W = 640, PAD = 56;
    var color = D.colorPrincipal || '#0f172a';
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    var y = PAD;

    // Altura total calculada de antemano, según lo que vamos a dibujar
    var qrSize = 460;
    var H = PAD + 24 + 34 + 22 + 18 + qrSize + 40 + 30 + 20 + 60 + PAD;
    canvas.width = W;
    canvas.height = H;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';

    ctx.fillStyle = '#64748b';
    ctx.font = '700 14px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText(String(D.evento || '').toUpperCase(), W/2, y); y += 34;

    ctx.fillStyle = color;
    ctx.font = '700 27px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText('Acceso personal', W/2, y); y += 26;

    ctx.fillStyle = '#64748b';
    ctx.font = '400 15px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText(D.fecha + ' · ' + D.hora + ' h', W/2, y); y += 20;
    ctx.fillText(String(D.lugarEvento || ''), W/2, y); y += 32;

    // QR con marco
    var qrX = (W - qrSize) / 2;
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.strokeRect(qrX - 1, y - 1, qrSize + 2, qrSize + 2);
    ctx.drawImage(imgQR, qrX, y, qrSize, qrSize);
    y += qrSize + 40;

    ctx.fillStyle = '#0f172a';
    ctx.font = '700 23px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText(String(D.nombre || ''), W/2, y); y += 26;

    ctx.fillStyle = '#94a3b8';
    ctx.font = '400 13px ui-monospace, Menlo, monospace';
    ctx.fillText(String(D.paseID || ''), W/2, y); y += 34;

    ctx.fillStyle = '#334155';
    ctx.font = '600 15px -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText((D.ubicacion || '') + '  ·  ' + (D.estatusPago || ''), W/2, y);

    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'acceso-' + D.paseID + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      boton.disabled = false;
      boton.textContent = 'Descargar código QR';
    });
  }

  if('wakeLock' in navigator){
    navigator.wakeLock.request('screen').catch(function(){});
  }
}
</script>
</body>
</html>
